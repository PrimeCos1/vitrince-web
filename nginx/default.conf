# Vitrince – statische Website hinter Traefik
server_tokens off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # KVKK: keine Zugriffsprotokolle mit IP-Adressen
    access_log off;
    error_log /dev/stderr warn;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location ~* \.(webp|png|jpg|jpeg|woff2|ico)$ {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
